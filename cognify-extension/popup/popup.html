<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cognify Extension</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo"></div>
      <h1>Cognify</h1>
    </div>
    <div id="status-dot" class="status-dot"></div>
  </div>

  <div class="main-content" id="login-view">
    <p class="subtitle">Please login to the web dashboard first.</p>
    <button id="login-btn" class="btn">Open Dashboard</button>
  </div>

  <div class="main-content hidden" id="active-view">
    <div class="stat-row">
      <div class="stat-card">
        <span class="stat-label">Conscious</span>
        <span class="stat-value" id="conscious-count">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Avg Match</span>
        <span class="stat-value" id="avg-match">0%</span>
      </div>
    </div>
    
    <div class="current-site">
      <div class="site-header">
        <span class="site-title">Current Target</span>
      </div>
      <p class="site-name" id="site-name">Inactive</p>
      <p class="site-desc" id="site-desc">Navigate to YouTube or Instagram</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
