<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognify</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Logo -->
    <div class="logo-row">
      <div class="logo-circle">C</div>
      <span class="logo-text">Cognify</span>
    </div>

    <!-- Status -->
    <div class="status-row">
      <span class="status-dot"></span>
      <span class="status-label">Extension active</span>
    </div>

    <!-- Last analyzed -->
    <div class="last-analyzed">
      <div class="last-label">Last analyzed</div>
      <div class="last-title" id="last-title">No videos analyzed yet</div>
      <div class="last-meta" id="last-meta"></div>
    </div>

    <!-- Dashboard button -->
    <button id="dashboard-btn" class="dashboard-btn">Open Dashboard ↗</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
