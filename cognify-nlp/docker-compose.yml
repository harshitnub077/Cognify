version: '3.8'

services:
  nlp-api:
    build: .
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - PERSPECTIVE_API_KEY=${PERSPECTIVE_API_KEY}
    depends_on:
      - redis
    volumes:
      - ./models_cache:/root/.cache/huggingface

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
