version: '3.8'

services:
  # ----------------------------------------------------
  # 1. NLP Core AI Engine (Python FastAPI)
  # ----------------------------------------------------
  nlp-api:
    build: 
      context: ./cognify-nlp
      dockerfile: Dockerfile
    container_name: cognify-nlp
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      # Add API keys here if you want to test them inside docker, or use an env file
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - redis
      - qdrant
    volumes:
      - ./cognify-nlp/models_cache:/root/.cache/huggingface

  # ----------------------------------------------------
  # 2. Main Backend (Node.js Express)
  # ----------------------------------------------------
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognify-backend
    ports:
      - "3001:3001"
    environment:
      # Connect to the local Postgres container
      - DATABASE_URL=postgresql://postgres:cognifylocal@postgres:5432/cognify
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ----------------------------------------------------
  # 3. PostgreSQL Database (Local Dev)
  # ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: cognify-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=cognifylocal
      - POSTGRES_DB=cognify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cognify"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 4. Redis (Caching and Queues)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cognify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ----------------------------------------------------
  # 5. Qdrant (Local Vector DB)
  # ----------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cognify-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
